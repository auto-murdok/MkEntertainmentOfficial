name: CI

# Unity test suite on a self-hosted runner (the gaming PC, where the editor
# is installed and licensed). This repository is public, so fork pull
# requests must never execute code on that machine: every job below is
# guarded to same-repository branches only, and the workflow uses no
# secrets beyond the default read-only GITHUB_TOKEN.
#
# Known batchmode baseline (verified identical on unmodified main,
# 2026-10-24 — these are suite issues to settle separately, not CI
# exclusions, and no test is filtered out):
# - EditMode 107/108: GameCliArgsTests.IsAutomated_FalseForPlainLaunch
#   asserts a non-batchmode launch; automated runs are batchmode by
#   definition.
# - PlayMode: previously 134/136 with
#   BulletProjectilePlayTests.MaxTravelDistance_BulletIsReleasedIntoEmptySpace
#   (frame-count wait vs unthrottled batchmode frames) and
#   PauseMenuControllerPlayTests.SetOpen_TogglesVisibilityAndCursor
#   (cursor re-lock, unobservable headless). Both test harnesses were
#   fixed in 2026-10 (assertions unchanged); the suite is expected
#   fully green. Any new failure is a real regression.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Unity instance at a time against the shared Library on the runner.
concurrency:
  group: unity-ci-gamingpc
  cancel-in-progress: false

jobs:
  editmode:
    name: EditMode tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, unity]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep Library/ warm between runs on this machine.
          clean: false
          fetch-depth: 1
      - name: Run EditMode tests
        shell: powershell
        run: |
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          & $unity test . --mode EditMode --output test-results-editmode.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: test-results-editmode.xml
          if-no-files-found: warn

  playmode:
    name: PlayMode tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, unity]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1
      - name: Run PlayMode tests
        shell: powershell
        run: |
          $unity = Join-Path $env:LOCALAPPDATA 'Unity\bin\unity.exe'
          & $unity test . --mode PlayMode --output test-results-playmode.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-test-results
          path: test-results-playmode.xml
          if-no-files-found: warn
